name: Test encoding input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/todos/1'
          encoding: 'utf-8'
          save-location: 'fetch-api-data-action'
          save-name: 'data-encoding-test'
          set-output: 'true'
      - name: Assert output file exists
        run: |
          if [ ! -f "fetch-api-data-action/data-encoding-test.json" ]; then
            echo "FAIL: expected file fetch-api-data-action/data-encoding-test.json not found"
            ls -la fetch-api-data-action/ || true
            exit 1
          fi
          echo "PASS: file exists"
      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty output"
            exit 1
          fi
          echo "PASS"
