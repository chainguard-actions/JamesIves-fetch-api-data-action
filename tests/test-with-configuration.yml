name: Test with configuration headers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: fetch
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/comments/1'
          configuration: '{"method": "GET", "headers": {"Accept": "application/json"}}'
          set-output: 'true'

      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.fetch.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected fetchApiData output to be non-empty"
            exit 1
          fi
          echo "PASS: output is non-empty"

      - name: Assert output contains comment fields
        env:
          ACTUAL: ${{ steps.fetch.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q '"email"'; then
            echo "FAIL: expected output to contain 'email' field"
            exit 1
          fi
          if ! echo "$ACTUAL" | grep -q '"body"'; then
            echo "FAIL: expected output to contain 'body' field"
            exit 1
          fi
          echo "PASS: output contains expected comment fields"

      - name: Assert data file was saved
        run: |
          FILE="fetch-api-data-action/data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist"
            exit 1
          fi
          echo "PASS: file exists at $FILE"
