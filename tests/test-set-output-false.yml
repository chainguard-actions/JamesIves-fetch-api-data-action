name: Test set-output false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/todos/2'
          set-output: 'false'
          debug: 'true'

      - name: Assert output is empty when set-output is false
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected fetchApiData output to be empty when set-output is false, but got: $ACTUAL"
            exit 1
          fi
          echo "PASS: fetchApiData output is empty as expected"

      - name: Assert file was still saved even when set-output is false
        run: |
          FILE="fetch-api-data-action/data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist even when set-output is false"
            exit 1
          fi
          echo "Contents of $FILE:"
          cat "$FILE"
          echo ""
          echo "PASS: file exists"
