name: Test Set Output False
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/users/1'
          set-output: 'false'
          debug: 'true'

      - name: Assert output is empty when set-output is false
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty output when set-output is false, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: output is empty as expected when set-output is false"

      - name: Assert data file was still saved
        run: |
          FILE="fetch-api-data-action/data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist even when set-output is false"
            exit 1
          fi
          echo "PASS: data file exists at $FILE"
          cat "$FILE"

      - name: Assert saved file contains expected data
        run: |
          FILE="fetch-api-data-action/data.json"
          CONTENT=$(cat "$FILE")
          echo "content: $CONTENT"
          if ! echo "$CONTENT" | grep -q '"id"'; then
            echo "FAIL: expected 'id' field in saved file"
            exit 1
          fi
          echo "PASS: saved file contains expected data"
