name: Test set-output false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://httpbin.org/get'
          set-output: 'false'

      - name: Assert file was still saved
        run: |
          FILE="fetch-api-data-action/data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' not found"
            ls -la fetch-api-data-action/ 2>/dev/null || echo "(directory missing)"
            exit 1
          fi
          echo "PASS: file '$FILE' exists"
          cat "$FILE"

      - name: Assert output is empty when set-output is false
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "WARN: fetchApiData output is set even though set-output=false (may be acceptable)"
          else
            echo "PASS: fetchApiData output is empty as expected"
          fi
