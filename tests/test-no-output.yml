name: Test set-output false
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/users/1'
          set-output: 'false'
      - name: Assert output variable is empty when set-output is false
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected fetchApiData output to be empty when set-output is false, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: fetchApiData output is empty as expected"
      - name: Assert default output file still exists
        run: |
          FILE="fetch-api-data-action/data.json"
          echo "Checking for file: $FILE"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' not found"
            exit 1
          fi
          echo "PASS: file exists"
