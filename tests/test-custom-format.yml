name: Test Custom File Format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/todos/5'
          save-location: 'custom-format-output'
          save-name: 'result'
          format: 'txt'
          set-output: 'true'
          debug: 'true'

      - name: Assert txt file was saved at specified location
        run: |
          FILE="custom-format-output/result.txt"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist"
            ls -la custom-format-output/ 2>/dev/null || echo "Directory custom-format-output does not exist"
            exit 1
          fi
          echo "PASS: data file exists at $FILE"
          cat "$FILE"

      - name: Assert saved txt file contains expected data
        run: |
          FILE="custom-format-output/result.txt"
          CONTENT=$(cat "$FILE")
          echo "content: $CONTENT"
          if ! echo "$CONTENT" | grep -q '"id"'; then
            echo "FAIL: expected 'id' field in saved file"
            exit 1
          fi
          echo "PASS: saved txt file contains expected data"

      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty output from fetchApiData"
            exit 1
          fi
          echo "PASS: output is non-empty"
