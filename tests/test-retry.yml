name: Test retry option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/users/1'
          retry: 'true'
          debug: 'true'

      - name: Assert output is set with retry enabled
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected fetchApiData output to be non-empty"
            exit 1
          fi
          echo "PASS: fetchApiData output is set"

      - name: Assert file was saved with retry enabled
        run: |
          FILE="fetch-api-data-action/data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist"
            exit 1
          fi
          echo "Contents of $FILE:"
          cat "$FILE"
          echo ""
          echo "PASS: file exists"

      - name: Assert response contains user data
        run: |
          FILE="fetch-api-data-action/data.json"
          if ! grep -q '"name"' "$FILE"; then
            echo "FAIL: expected JSON to contain 'name' field"
            exit 1
          fi
          echo "PASS: JSON contains expected user data"
