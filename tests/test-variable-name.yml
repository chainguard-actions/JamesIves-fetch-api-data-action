name: Test custom variable name output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/todos/3'
          variable-name: 'myCustomVar'
          debug: 'true'

      - name: Assert default output is set (fetchApiData)
        env:
          DEFAULT_OUTPUT: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "default output: $DEFAULT_OUTPUT"
          # The action exports under the custom variable name; the action.yml declares
          # fetchApiData as the output. Check that at least one of them is non-empty.
          if [ -z "$DEFAULT_OUTPUT" ]; then
            echo "INFO: fetchApiData output is empty (may be exported under custom name)"
          else
            echo "PASS: fetchApiData output is set"
          fi

      - name: Assert file was saved regardless of variable name
        run: |
          FILE="fetch-api-data-action/data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist"
            exit 1
          fi
          echo "Contents of $FILE:"
          cat "$FILE"
          echo ""
          echo "PASS: file exists"

      - name: Assert file contains valid data
        run: |
          FILE="fetch-api-data-action/data.json"
          if ! grep -q '"id"' "$FILE"; then
            echo "FAIL: expected JSON to contain 'id' field"
            exit 1
          fi
          echo "PASS: JSON contains expected fields"
