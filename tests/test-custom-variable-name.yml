name: Test Custom Variable Name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/comments/1'
          variable-name: 'myCustomVar'
          set-output: 'true'
          debug: 'true'

      - name: Assert default output fetchApiData is non-empty or custom var is set
        env:
          DEFAULT_OUTPUT: ${{ steps.action.outputs.fetchApiData }}
          CUSTOM_OUTPUT: ${{ steps.action.outputs.myCustomVar }}
        run: |
          echo "default output: '$DEFAULT_OUTPUT'"
          echo "custom output: '$CUSTOM_OUTPUT'"
          # When variable-name is set, the action may export under the custom name
          # Check that at least one of them is non-empty
          if [ -z "$DEFAULT_OUTPUT" ] && [ -z "$CUSTOM_OUTPUT" ]; then
            echo "FAIL: expected at least one output to be non-empty"
            exit 1
          fi
          echo "PASS: at least one output is non-empty"

      - name: Assert data file was saved
        run: |
          FILE="fetch-api-data-action/data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist"
            exit 1
          fi
          echo "PASS: data file exists at $FILE"
          cat "$FILE"

      - name: Assert saved file contains expected data
        run: |
          FILE="fetch-api-data-action/data.json"
          CONTENT=$(cat "$FILE")
          echo "content: $CONTENT"
          if ! echo "$CONTENT" | grep -q '"id"'; then
            echo "FAIL: expected 'id' field in saved file"
            exit 1
          fi
          if ! echo "$CONTENT" | grep -q '"email"'; then
            echo "FAIL: expected 'email' field in saved file"
            exit 1
          fi
          echo "PASS: saved file contains expected data"
