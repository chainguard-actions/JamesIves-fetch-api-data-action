name: Test custom file format (txt)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/todos/4'
          save-name: 'output'
          format: 'txt'
          debug: 'true'

      - name: Assert txt file was saved
        run: |
          FILE="fetch-api-data-action/output.txt"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist"
            ls -la fetch-api-data-action/ 2>/dev/null || echo "(directory does not exist)"
            exit 1
          fi
          echo "Contents of $FILE:"
          cat "$FILE"
          echo ""
          echo "PASS: txt file exists at expected path"

      - name: Assert txt file is non-empty
        run: |
          FILE="fetch-api-data-action/output.txt"
          if [ ! -s "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to be non-empty"
            exit 1
          fi
          echo "PASS: txt file is non-empty"
