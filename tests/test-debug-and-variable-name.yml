name: Test debug mode and custom variable name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: fetch
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/todos/5'
          debug: 'true'
          variable-name: 'myApiData'
          set-output: 'true'

      - name: Assert fetchApiData output is set (action always uses fetchApiData as output key)
        env:
          ACTUAL: ${{ steps.fetch.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected fetchApiData output to be non-empty"
            exit 1
          fi
          echo "PASS: fetchApiData output is set"

      - name: Assert output contains todo data
        env:
          ACTUAL: ${{ steps.fetch.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q '"id"'; then
            echo "FAIL: expected output to contain 'id' field"
            exit 1
          fi
          echo "PASS: output contains expected todo data"

      - name: Assert default file is saved
        run: |
          FILE="fetch-api-data-action/data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist"
            exit 1
          fi
          echo "PASS: file exists at $FILE"
