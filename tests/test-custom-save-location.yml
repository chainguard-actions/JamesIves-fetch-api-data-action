name: Test custom save location and name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://httpbin.org/json'
          save-location: 'my-custom-dir'
          save-name: 'my-data'
          set-output: 'true'

      - name: Assert custom file was saved
        run: |
          FILE="my-custom-dir/my-data.json"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' not found"
            find . -name "*.json" 2>/dev/null | head -20
            exit 1
          fi
          echo "PASS: file '$FILE' exists"
          cat "$FILE"

      - name: Assert output contains data
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: fetchApiData output is empty"
            exit 1
          fi
          echo "PASS: fetchApiData output is set"
