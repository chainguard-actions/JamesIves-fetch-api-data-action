name: Test debug mode and custom format
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          endpoint: 'https://jsonplaceholder.typicode.com/todos/5'
          debug: 'true'
          format: 'txt'
          save-location: 'debug-output'
          save-name: 'result'
          set-output: 'true'

      - name: Assert txt file was saved
        run: |
          FILE="debug-output/result.txt"
          if [ ! -f "$FILE" ]; then
            echo "FAIL: expected file '$FILE' to exist"
            exit 1
          fi
          echo "PASS: file '$FILE' exists"
          cat "$FILE"

      - name: Assert output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.fetchApiData }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected fetchApiData output to be non-empty"
            exit 1
          fi
          echo "PASS: fetchApiData output is non-empty"
